<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>磁磚・大宗物料倉管系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3efe8;--sf:#fffdf9;--tx:#2a2622;--mu:#7a7167;--ln:#ddd3c4;--hd:#f5c9a4;--alt:#fbeadb;--ac:#1f5d63;--ac2:#fff;--wn:#b3382c;--ok:#2d7a4f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--sf:#272421;--tx:#ece6dc;--mu:#a39a8e;--ln:#3d3833;--hd:#5a3e29;--alt:#2d2926;--ac:#6cc3c9;--ac2:#10282a;--wn:#ff8b7d;--ok:#6fd09a;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{padding:18px 20px 8px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:26px;letter-spacing:.04em;font-weight:700}
.sub{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:8px 20px}
.st{background:var(--sf);border:1px solid var(--ln);padding:10px 14px}
.st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.st span{color:var(--mu);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:6px 14px;cursor:pointer;font:inherit}
.tab[aria-pressed=true]{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);padding:6px 8px;min-width:0}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--ac2);padding:6px 14px}
.btn.g{background:transparent;color:var(--ac)}
.btn.s{padding:2px 8px;font-size:12px}
.btn.d{border-color:var(--wn);color:var(--wn);background:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.sp{flex:1}
.wrap{margin:0 20px 40px;overflow-x:auto;border:1px solid var(--ln);background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:1180px}
th{background:var(--hd);text-align:center;padding:8px 6px;font-weight:600;white-space:nowrap;border:1px solid var(--ln)}
td{padding:8px 6px;border:1px solid var(--ln);text-align:center;font-variant-numeric:tabular-nums;vertical-align:middle}
tbody tr:nth-child(even){background:var(--alt)}
td.n{text-align:right}
td.nm{font-weight:600;text-align:left}
.low{color:var(--wn);font-weight:700}
.zero{color:var(--mu)}
.bd{height:6px;background:var(--ln);margin-top:4px}.bd i{display:block;height:100%;background:var(--ok)}
.acts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
dialog{border:1px solid var(--ln);background:var(--sf);color:var(--tx);padding:0;max-width:560px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:12px 16px;background:var(--hd);font-weight:700;display:flex;justify-content:space-between}
.db{padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.db label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mu)}
.db .f{grid-column:1/-1}
.df{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end}
.hist{grid-column:1/-1;max-height:180px;overflow:auto;border:1px solid var(--ln)}
.hist table{min-width:0;font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;display:none}
.th{width:44px;height:44px;object-fit:cover;border:1px solid var(--ln);display:block;margin:0 0 4px;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:14px 16px;max-height:55vh;overflow:auto}
.pg figure{margin:0;position:relative}.pg img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--ln);cursor:zoom-in;display:block}
.pg figure.big{grid-column:1/-1}.pg figure.big img{aspect-ratio:auto;max-height:50vh;object-fit:contain;cursor:zoom-out;background:var(--alt)}
.pg .x{position:absolute;top:4px;right:4px}
.up{display:inline-block;cursor:pointer}.up input{display:none}
.orow{display:flex;gap:8px;align-items:center;margin-top:6px}.orow input{flex:1}
[hidden]{display:none!important}
#rkBody tbody tr{background:var(--alt)!important}#rkBody tbody tr.rks{background:var(--sf)!important}
#rkBody tr.rks td{font-size:12px;color:var(--mu);padding:4px 6px}
@media(max-width:600px){.db{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>磁磚・大宗物料倉管系統</h1><div class="sub">依「尚海庫存材料單」架構建立：原數量 − 移用 = 剩餘，自動換算面積與金額</div></div>
  <div class="sub" id="today"></div>
</header>
<div class="stats" id="stats"></div>
<div class="bar">
  <div class="tabs" id="tabs"></div>
  <input id="q" type="search" placeholder="搜尋品項／顏色／來源工地" aria-label="搜尋">
  <select id="catF" aria-label="物料類別"></select>
  <label class="sub"><input type="checkbox" id="onlyLeft"> 僅顯示有庫存</label>
  <span class="sp"></span>
  <button class="btn g" id="xOut">匯出 XLSX</button>
  <label class="btn g up" style="padding:6px 14px">匯入 XLSX<input type="file" id="xIn" accept=".xlsx,.xls"></label>
  <button class="btn g" id="optBtn">管理倉別／工地</button>
  <button class="btn g" id="rkBtn">移用金額排行</button>
  <button class="btn" id="add">＋ 新增物料</button>
</div>
<div class="wrap"><table>
<thead><tr><th>編號</th><th>品項</th><th>顏色／規格</th><th>寬×長 (cm)</th><th>入數/箱</th><th>箱數(包)</th><th>入庫數量</th><th>來源工地</th><th>單價/單位</th><th>原面積 m²</th><th>移用 m²</th><th>庫存數量</th><th>庫存 m²</th><th>入庫金額</th><th>移用金額</th><th>庫存金額</th><th>移用紀錄</th><th>管理</th></tr></thead>
<tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>找不到符合的物料，請調整篩選或按「新增物料」。</div></div>

<dialog id="dItem"><form method="dialog" id="fItem">
  <div class="dh"><span id="tItem">新增物料</span></div>
  <div class="db">
    <label>倉別／樓層<select name="floor" data-opt="floors"></select><input name="floor_new" placeholder="輸入新倉別名稱" hidden></label>
    <label>編號（自動）<input name="no" type="number" readonly style="opacity:.7"></label>
    <label>物料類別<select name="cat" data-opt="cats"></select><input name="cat_new" placeholder="輸入新類別" hidden></label>
    <label>基本單位<input name="unit" placeholder="片／包／支／袋／公斤"></label>
    <label class="f">品項<input name="name" required placeholder="例：山型壁磚／水泥／鋼筋"></label>
    <label>顏色／規格<input name="color" placeholder="例：四色／#4 鋼筋／42.5級"></label>
    <label>來源工地<select name="src" data-opt="sites"></select><input name="src_new" placeholder="輸入新工地名稱" hidden></label>
    <label class="tl">寬 (cm)<input name="w" type="number" step="any"></label>
    <label class="tl">長 (cm)<input name="l" type="number" step="any"></label>
    <label>入數／箱(包)<input name="pcs" type="number" min="0" required></label>
    <label>箱數(包)<input name="boxes" type="number" min="0" required></label>
    <label>單價／基本單位 (元)<input name="price" type="number" step="any" min="0"></label>
    <label class="f">備註<input name="note"></label>
    <div class="f"><div class="sub">照片（按「儲存」後才會生效）</div><div class="pg" id="ePhotos" style="padding:6px 0"></div><label class="btn g up s" style="color:var(--ac);flex-direction:row;font-size:13px">＋ 拍照／選擇照片<input type="file" id="eFile" accept="image/*" multiple></label></div>
  </div>
  <div class="df"><button type="button" class="btn d" id="del" hidden>刪除</button><span class="sp"></span><button type="button" class="btn g" data-close>取消</button><button class="btn" value="ok">儲存</button></div>
</form></dialog>

<dialog id="dMove"><form method="dialog" id="fMove">
  <div class="dh"><span id="tMove">移用／出庫</span></div>
  <div class="db">
    <div class="f sub" id="mInfo"></div>
    <label>類型<select name="type"><option value="out">移用（出庫）</option><option value="in">補入庫（進貨／退回）</option></select></label>
    <label>移用日期<input name="date" type="date" required></label>
    <label>數量<input name="qty" type="number" min="0" step="any" required></label>
    <label>單位<select name="unit"><option value="box">箱</option><option value="pc">片</option></select></label>
    <label class="f">移往工地<select name="to" data-opt="sites"></select><input name="to_new" placeholder="輸入新工地名稱" hidden></label>
    <div class="hist" id="mHist"></div>
  </div>
  <div class="df"><button type="button" class="btn g" data-close>關閉</button><button class="btn" value="ok">登錄</button></div>
</form></dialog>
<dialog id="dRank" style="max-width:720px">
  <div class="dh"><span>移用金額排行（工地別）</span></div>
  <div style="padding:12px 16px 0"><label class="sub">統計依據：<select id="rkBy"><option value="src">來源（不論有無移用）</option><option value="to">移用（移往工地）</option></select></label></div>
  <div id="rkBody" style="padding:12px 16px;overflow:auto;max-height:60vh"></div>
  <div class="df"><span class="sub" style="flex:1">來源：依來源工地統計入庫金額；移用：依移往工地統計移用金額（補入庫不計）。</span><button type="button" class="btn g" data-close>關閉</button></div>
</dialog>
<dialog id="dOpt">
  <div class="dh"><span>管理倉別／工地選單</span></div>
  <div class="db" id="oBody"></div>
  <div class="df"><span class="sub" style="flex:1">直接修改名稱即可改名，已有物料的資料會一併更新。</span><button type="button" class="btn g" data-close>完成</button></div>
</dialog>
<dialog id="dPhoto">
  <div class="dh"><span id="tPhoto">照片</span></div>
  <div class="pg" id="pGrid"></div>
  <div class="df"><label class="btn up">＋ 拍照／選擇照片<input type="file" id="pFile" accept="image/*" multiple></label><span class="sp"></span><button type="button" class="btn g" data-close>關閉</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY="tile-wms-v1";
const $=s=>document.querySelector(s);
const seed=()=>[
 {id:1,floor:"1F",no:1,name:"山型壁磚",color:"四色",w:6,l:22.7,pcs:60,boxes:661,src:"淡海2",price:4,note:"",moves:[]},
 {id:2,floor:"1F",no:1,name:"平面壁磚",color:"四色",w:6,l:22.7,pcs:80,boxes:325,src:"淡海2",price:3,note:"",moves:[{date:"2026-03-14",to:"五股成州",pc:26000,type:"out"}]},
 {id:3,floor:"1F",no:1,name:"山型+平磚",color:"四色",w:6,l:22.7,pcs:60,boxes:88,src:"淡海2",price:4,note:"",moves:[]},
 {id:4,floor:"1F",no:1,name:"山型(混單短)",color:"四色",w:"",l:"",pcs:60,boxes:176,src:"淡海2",price:4,note:"",moves:[]},
 {id:5,floor:"1F",no:1,name:"山型加工(加工剩料)",color:"四色",w:"",l:"",pcs:178,boxes:440,src:"淡海2",price:0,note:"",moves:[]},
 {id:6,floor:"1F",no:1,name:"平磚加工(加工剩料)",color:"四色",w:"",l:"",pcs:178,boxes:561,src:"淡海2",price:0,note:"",moves:[]},
 {id:7,floor:"1F",no:1,name:"加工壁磚(三色混箱)",color:"四色",w:"",l:"",pcs:178,boxes:80,src:"淡海2",price:0,note:"",moves:[]}
];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.length)S=seed();
let floor="全部",editId=null,moveId=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const n=v=>Number(v)||0;
const f0=v=>Math.round(v).toLocaleString("zh-TW");
const f1=v=>(Math.round(v*10)/10).toLocaleString("zh-TW",{minimumFractionDigits:1});
function calc(it){
  const tot=n(it.pcs)*n(it.boxes), sz=n(it.w)*n(it.l)/10000;
  let out=0,inn=0;
  it.moves.forEach(m=>m.type==="in"?inn+=m.pc:out+=m.pc);
  const orig=tot, left=tot-out+inn;
  return {tot,sz,out,inn,left,aO:tot*sz,aM:out*sz,aL:left*sz,vO:tot*n(it.price),vM:out*n(it.price),vL:left*n(it.price)};
}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2000)}
function render(){
  const floors=["全部",...new Set(S.map(i=>i.floor))];
  if(!floors.includes(floor))floor="全部";
  $("#tabs").innerHTML=floors.map(f=>`<button class="tab" aria-pressed="${f===floor}" data-f="${f}">${f}</button>`).join("");
  const q=$("#q").value.trim().toLowerCase(), only=$("#onlyLeft").checked;
  const cf0=$("#catF").value;$("#catF").innerHTML='<option value="">全部類別</option>'+O.cats.map(v=>`<option>${esc(v)}</option>`).join("");$("#catF").value=cf0;const cf=$("#catF").value;
  const list=S.filter(i=>(floor==="全部"||i.floor===floor)&&(!cf||(i.cat||"磁磚")===cf)&&[i.name,i.color,i.src,i.note].join(" ").toLowerCase().includes(q)&&(!only||calc(i).left>0));
  let tp=0,tl=0,tv=0,tin=0,lowN=0;
  $("#rows").innerHTML=list.map(i=>{
    const c=calc(i);tp+=c.tot;tl+=c.left;tv+=c.vL;tin+=c.vO;
    const pct=c.tot?Math.max(0,Math.min(100,c.left/c.tot*100)):0;
    if(c.tot&&pct<20)lowN++;
    const hasA=c.sz>0, dash='<span class="zero">—</span>';
    const last=i.moves.length?`${i.moves.length} 筆・${i.moves[i.moves.length-1].date.replaceAll("-","/")} ${esc(i.moves[i.moves.length-1].to||"")}`:dash;
    return `<tr><td>${i.no}</td><td class="nm">${P[i.id]&&P[i.id][0]?`<img class="th" src="${P[i.id][0]}" alt="" data-ph="${i.id}">`:""}${esc(i.name)}<div class="sub">${esc(i.floor)} / ${esc(i.cat||"磁磚")}</div></td><td>${esc(i.color||"")}</td>
    <td>${hasA?n(i.w)+"×"+n(i.l):dash}</td><td>${n(i.pcs)}</td><td>${f0(n(i.boxes))}</td><td class="n">${f0(c.tot)} <span class="sub">${esc(i.unit||"片")}</span></td><td>${esc(i.src||"")}</td><td>${n(i.price)||dash}</td>
    <td class="n">${hasA?f1(c.aO):dash}</td><td class="n">${hasA&&c.out?f1(c.aM):dash}</td>
    <td class="n ${pct<20?"low":""}">${f0(c.left)} <span class="sub">${esc(i.unit||"片")}</span><div class="bd"><i style="width:${pct}%"></i></div></td>
    <td class="n">${hasA?f1(c.aL):dash}</td><td class="n">${c.vO?f0(c.vO):dash}</td><td class="n">${c.vM?f0(c.vM):dash}</td><td class="n">${c.vL?f0(c.vL):dash}</td>
    <td class="sub">${last}</td>
    <td><div class="acts"><button class="btn s" data-mv="${i.id}">移用</button><button class="btn s g" data-ph="${i.id}">照片${P[i.id]&&P[i.id].length?"("+P[i.id].length+")":""}</button><button class="btn s g" data-ed="${i.id}">編輯</button></div></td></tr>`}).join("");
  $("#empty").hidden=list.length>0;
  $("#stats").innerHTML=[["物料品項",list.length],["入庫數量",f0(tp)],["入庫金額(元)",f0(tin)],["庫存數量",f0(tl)],["庫存金額(元)",f0(tv)],["消化庫存金額(元)",f0(tin-tv)],["庫存去化率%",tin?(Math.round((tin-tv)/tin*1000)/10)+"%":"—"]].map(([a,b])=>`<div class="st"><b>${b}</b><span>${a}</span></div>`).join("");
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function openItem(id){
  editId=id;const f=$("#fItem"),it=S.find(x=>x.id===id)||{floor:floor==="全部"?"1F":floor,no:nextNo()};
  $("#tItem").textContent=id?"編輯物料":"新增物料";$("#del").hidden=!id;
  ["floor","no","name","color","src","w","l","pcs","boxes","price","note","unit"].forEach(k=>f.elements[k].value=it[k]??"");
  fillOpts(f,it);if(!f.elements.unit.value&&(it.cat||"磁磚")==="磁磚")f.elements.unit.value="片";catUI();pend=[...(P[id]||[])];drawE();$("#dItem").showModal();
}
$("#fItem").addEventListener("submit",e=>{
  if(e.submitter&&e.submitter.value!=="ok")return;
  const f=e.target.elements,d={};
  ["floor","no","name","color","src","w","l","pcs","boxes","price","note","cat","unit"].forEach(k=>d[k]=f[k].value.trim());
  for(const [k,ok,inp] of [["floor","floors","floor_new"],["src","sites","src_new"],["cat","cats","cat_new"]]){
    if(d[k]==="__new"){const v=f[inp].value.trim();if(!v&&k!=="src"){e.preventDefault();toast("請輸入名稱");return}d[k]=v;if(v&&!O[ok].includes(v)){O[ok].push(v);saveO()}}
  }
  if(d.cat!=="磁磚"){d.w="";d.l=""}
  let tid=editId;
  if(editId){Object.assign(S.find(x=>x.id===editId),d)}else{tid=Date.now();d.no=nextNo();S.push({id:tid,moves:[],...d})}
  P[tid]=pend.slice();putPhotos(tid);
  save();render();toast("已儲存");
});
$("#del").onclick=()=>{if(editId&&confirm("確定刪除此物料與其移用紀錄、照片？")){delPhotos(editId);S=S.filter(x=>x.id!==editId);save();$("#dItem").close();render();toast("已刪除")}};
function openMove(id){
  moveId=id;const it=S.find(x=>x.id===id),c=calc(it);
  $("#tMove").textContent="移用／出庫："+it.name;
  {const u=$("#fMove").elements.unit;u.options[0].textContent="箱／包裝";u.options[1].textContent=it.unit||"片"}
  $("#mInfo").textContent=`目前庫存 ${f0(c.left)} ${it.unit||"片"}（約 ${f0(c.left/Math.max(1,n(it.pcs)))} 箱）${c.sz?`・${f1(c.aL)} m²`:""}`;
  $("#fMove").elements.date.value=new Date().toISOString().slice(0,10);
  $("#fMove").elements.qty.value="";
  $("#mHist").innerHTML=it.moves.length?`<table><thead><tr><th>移用日期</th><th>類型</th><th>片數</th><th>去向</th><th></th></tr></thead><tbody>${it.moves.map((m,k)=>`<tr><td>${m.date}</td><td>${m.type==="in"?"入庫":"移用"}</td><td>${f0(m.pc)}</td><td>${esc(m.to||"")}</td><td><button type="button" class="btn s d" data-rm="${k}">撤銷</button></td></tr>`).join("")}</tbody></table>`:'<div class="empty" style="padding:14px">尚無移用紀錄</div>';
  {const sel=$("#fMove").elements.to;sel.innerHTML='<option value="">（未指定）</option>'+optList("sites").map(v=>`<option>${esc(v)}</option>`).join("")+'<option value="__new">＋ 自訂新增…</option>';sel.value="";toggleNew(sel)}
  $("#dMove").showModal();
}
$("#fMove").addEventListener("submit",e=>{
  if(e.submitter&&e.submitter.value!=="ok")return;
  const f=e.target.elements,it=S.find(x=>x.id===moveId);
  let pc=n(f.qty.value)*(f.unit.value==="box"?n(it.pcs):1);

let DL=null;
async function getDL(){

  try{DL=window.claude?await claude.use("downloads"):null}catch(e){DL=null}

}
async function saveFile(name,blob){

  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

$("#xIn").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;

    const rows=XLSX.utils.sheet_to_json(wb.Sheets["庫存"]||wb.Sheets[wb.SheetNames[0]],{defval:""});
    const mvS=wb.Sheets["移用紀錄"],mv=mvS?XLSX.utils.sheet_to_json(mvS,{defval:""}):null;
    const s=v=>String(v??"").trim(),key=(fl,nm,c,sr)=>[fl,nm,c,sr].map(s).join("|");
    const dt=v=>{if(typeof v==="number"){const p=XLSX.SSF.parse_date_code(v);return p?`${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`:""}return s(v).replaceAll("/","-")};
    let add=0,upd=0,seen=[];
    rows.forEach(r=>{
      const nm=s(r["品項"]);if(!nm)return;
      const d={floor:s(r["倉別"])||"1F",cat:s(r["類別"])||"磁磚",unit:s(r["單位"]),name:nm,color:s(r["顏色／規格"]),w:s(r["寬(cm)"]),l:s(r["長(cm)"]),pcs:n(r["入數／箱(包)"]),boxes:n(r["箱數(包)"]),src:s(r["來源工地"]),price:n(r["單價"]),note:s(r["備註"])};

      seen.push([k,it]);
    });
